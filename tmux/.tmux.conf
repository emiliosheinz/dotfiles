# Hot reload configuration with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g detach-on-destroy off  # don't exit tmux when the last window closes
set -g set-clipboard on
set -g automatic-rename off  # window names are set at creation and stay put
set -g status-position top

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB:sync'

# Reduce escape sequence weirdness
set -sg escape-time 10

# Keybindings
bind-key v split-window -h
bind-key h split-window -v
# Keep sibling panes equal after splits and closes
set-hook -g after-split-window 'select-layout -E'
set-hook -g after-kill-pane 'select-layout -E'
set-hook -g pane-exited 'select-layout -E'
bind-key c switch-client -T create
bind-key -T create c command-prompt -p "name:" { if -F "%1" { new-window -n "%1" -c "#{pane_current_path}" } { display-message "name required" } }
bind-key -T create h command-prompt -p "name:" { if -F "%1" { new-window -n "%1" -c "~" } { display-message "name required" } }
bind-key -T create o display-popup -E -w 40% -h 40% -b rounded -T " Open folder " -S "fg=#{@thm_lavender}" 'dir=$(find ~/dev -mindepth 1 -maxdepth 1 -type d -not -name ".*" | sort | fzf --prompt="folder: " --with-nth=-1 --delimiter="/") && [ -n "$dir" ] && tmux new-window -n "${dir##*/}" -c "$dir"'
bind-key X kill-window
bind-key x kill-pane
bind-key m resize-pane -Z

bind-key w switch-client -T workspace
bind-key -T workspace w display-popup -E -w 40% -h 40% -b rounded -T " Workspaces " -S "fg=#{@thm_lavender}" "ws switch"
bind-key -T workspace k display-popup -E -w 40% -h 40% -b rounded -T " Kill workspace " -S "fg=#{@thm_red}" "ws kill"

# Every agent in every workspace, with a preview of what it is doing
bind-key a display-popup -E -w 70% -h 70% -b rounded -T " Agents " -S "fg=#{@thm_lavender}" "ws-agents pick"

bind-key l switch-client -T lazy
bind-key -T lazy g display-popup -E -B -w 100% -h 100% -d "#{pane_current_path}" lazygit
bind-key -T lazy d display-popup -E -B -w 100% -h 100% -d "#{pane_current_path}" lazydocker
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Swap windows with H and L
bind-key H swap-window -t :-1 \; select-window -t :-1
bind-key L swap-window -t :+1 \; select-window -t :+1

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_status_background "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g @continuum-restore 'on'

run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar
set -g status-left-length 100
set -g status-justify left
set -g status-left "#[fg=#{?client_prefix,#{@thm_red},#{@thm_green}}]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{session_name}#[fg=#{@thm_surface_0},bg=default] "
# Agents at a glance: this workspace's agents by name on the right. State comes
# from hook-written files (see the ws-agents script); the line redraws on state
# change via `tmux refresh-client -S`, not on a poll.
set -g status-right-length 100
set -g status-right "#(ws-agents agents #{session_name})"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_overlay_1}]#I:#W"
set -g window-status-current-format "#[fg=#{@thm_fg},bold]#I:#W"

# Initialize TMUX plugin manager (keep at bottom)
run ~/.tmux/plugins/tpm/tpm

# Override catppuccin's centred prompt: tmux HEAD draws the label and the input apart when align is set,
# and without a fill the status line shows through
set -gF message-style "fg=#{@thm_teal},bg=terminal,fill=terminal"
set -gF message-command-style "fg=#{@thm_teal},bg=terminal,fill=terminal"
